map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
upstream chat_backend {
    server server:5000;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location /api/ { proxy_pass http://chat_backend; }
    location /uploads/ { proxy_pass http://chat_backend; }
    location = /health { proxy_pass http://chat_backend; }
    location = /ready { proxy_pass http://chat_backend; }
    location /socket.io/ {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location / { proxy_pass http://client:80; }
}
